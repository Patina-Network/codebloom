name: Slash Command Dispatch
run-name: Slash Command Dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  slashCommandDispatch:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # stay on trusted default-branch code until the commands action authorizes the commenter
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup pipeline
        uses: tahminator/pipeline/actions/setup@a424f92d486342e1255fcdf377a7569eb230aabe # 1.0.97
        with:
          LINT_CI: true

      - name: Slash Command Dispatch
        uses: tahminator/pipeline/actions/commands@a424f92d486342e1255fcdf377a7569eb230aabe # 1.0.97
        with:
          APP_ID: ${{ secrets._GITHUB_APP_APP_ID }}
          PRIVATE_KEY: ${{ secrets._GITHUB_APP_PEM_CONTENT }}
          DYNAMIC_COMMANDS_BUN_SCRIPT: .github/scripts/load-slash-commands/index.ts
