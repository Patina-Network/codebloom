name: E2E Test Command
run-name: Run E2E tests from PR #${{ inputs.prId }}

on:
  workflow_dispatch:
    inputs:
      prId:
        description: "PR whose head commit should be tested"
        required: true
      repository:
        description: "The repository from which the slash command was dispatched"
        required: true
      comment-id:
        description: "The comment-id of the slash command"
        required: true
      author:
        description: "The author that triggered this action"
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr:
    name: Get PR head
    runs-on: ubuntu-26.04
    outputs:
      sha: ${{ steps.pr-head.outputs.result }}
    steps:
      - name: Get PR head SHA
        id: pr-head
        uses: actions/github-script@v9
        env:
          PR_ID: ${{ inputs.prId }}
        with:
          result-encoding: string
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_ID),
            });
            return pr.head.sha;

  e2e:
    name: Run E2E tests
    needs: pr
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ needs.pr.outputs.sha }}
      skip_discord: true
    secrets: inherit
