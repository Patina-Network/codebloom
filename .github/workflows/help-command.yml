name: PR Help Comment
run-name: PR Help Comment

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  prHelpComment:
    name: PR Help Comment
    runs-on: ubuntu-26.04

    steps:
      - name: Help Comment
        uses: actions/checkout@v7

      - name: Setup CI
        uses: tahminator/pipeline/actions/setup@aa4f2ffcca89a9dcad96c1eac1e57b5a533f8c26 # 1.0.100
        with:
          LINT_CI: true
          SECRETS: ${{ toJSON(secrets) }}

      - name: Run script
        shell: bash
        run: bun run .github/scripts/help-message --pr-id=${{ github.event.pull_request.number }}
