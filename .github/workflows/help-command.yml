name: PR Help Comment
run-name: PR Help Comment

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  prHelpComment:
    name: PR Help Comment
    runs-on: ubuntu-26.04

    steps:
      - name: Help Comment
        uses: actions/checkout@v7

      - name: Setup CI
        uses: tahminator/pipeline/actions/setup@f5961a7e43a99ee5646ab7138f8b5cd2bfdeb24b # 1.0.101
        with:
          LINT_CI: true
          SECRETS: ${{ toJSON(secrets) }}

      - name: Run script
        shell: bash
        run: bun run .github/scripts/help-message --pr-id=${{ github.event.pull_request.number }}
