name: Migrate Staging Database
run-name: Migrate staging database from PR #${{ inputs.prId }}

on:
  workflow_dispatch:
    inputs:
      prId:
        description: "PR whose migrations should be applied"
        required: true
      repository:
        description: "The repository from which the slash command was dispatched"
        required: true
      comment-id:
        description: "The comment-id of the slash command"
        required: true
      author:
        description: "The author that triggered this action"
        required: true

# all prs share staging database, cannot cancel in progress.
concurrency:
  group: staging-db-migrations
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  migrate:
    name: Migrate staging DB
    runs-on: ubuntu-latest
    steps:
      - name: Get PR head SHA
        id: pr-head
        uses: actions/github-script@v8
        env:
          PR_ID: ${{ inputs.prId }}
        with:
          result-encoding: string
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_ID),
            });
            return pr.head.sha;

      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr-head.outputs.result }}
          fetch-depth: 0

      - name: Setup CI
        uses: tahminator/pipeline/actions/setup@a424f92d486342e1255fcdf377a7569eb230aabe # 1.0.97
        with:
          LINT_CI: true
          SECRETS: ${{ toJSON(secrets) }}
          HEADSCALE_ADDRESS: ${{ secrets.HEADSCALE_ADDRESS }}
          HEADSCALE_USER: ${{ secrets.HEADSCALE_USER }}
          HEADSCALE_PREAUTHKEY: ${{ secrets.HEADSCALE_PREAUTHKEY }}
          INSTALL_JAVA: "true"
          JAVA_VERSION: "25"
          JAVA_CACHE_KEY: ${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          JAVA_CACHE_PATH: |
            ~/.m2
            ~/repository

      - name: Apply staging database migrations
        run: bun run .github/scripts/redeploy/db/index.ts --sha="${{ steps.pr-head.outputs.result }}" --username="${{ inputs.author }}" --runUrl="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
