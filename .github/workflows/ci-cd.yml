name: CI/CD
run-name: Running CI/CD on ${{ github.actor }}'s commits

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backendPreTest:
    name: Backend Pre Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run workflow
        uses: ./.github/composite/test/backend-pre-test

  e2ePreTest:
    name: E2E Pre Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.24.0
          cache: true
          cache_dependency_path: js/pnpm-lock.yaml
          package_json_file: js/package.json

      - name: Run pre test
        shell: bash
        run: cd e2e && pnpm i && pnpm run test

  backendTests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backendPreTest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run workflow
        uses: ./.github/composite/test/backend-test
        with:
          SECRETS: ${{ toJSON(secrets) }}

  frontendTests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: backendPreTest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run workflow
        uses: ./.github/composite/test/frontend-test
        with:
          SECRETS: ${{ toJSON(secrets) }}

  buildStagingImage:
    name: Build staging image
    runs-on: ubuntu-latest
    needs: backendPreTest

    if: github.ref_name != 'main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup CI
        uses: ./.github/composite/setup-ci
        with:
          SECRETS: ${{ toJSON(secrets) }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.24.0
          cache: true
          cache_dependency_path: js/pnpm-lock.yaml
          package_json_file: js/package.json

      - name: Set up OpenJDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2
            ~/repository
          key: ${{ github.job }}-${{ hashFiles('**/pom.xml') }}

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Run workflow
        uses: ./.github/composite/build-image
        with:
          ENVIRONMENT: staging
          DOCKER_UPLOAD: "true"

  buildStagingStandupBotImage:
    name: Build staging image for codebloom-standup-bot
    runs-on: ubuntu-latest

    if: github.ref_name != 'main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run workflow
        uses: ./.github/composite/build-image/internal/standup-bot
        with:
          SECRETS: ${{ toJSON(secrets) }}
          ENVIRONMENT: staging
          DOCKER_UPLOAD: "true"

  validateDBSchema:
    name: Validate DB Schema on Prod DB
    runs-on: ubuntu-latest
    needs: backendPreTest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run workflow
        uses: ./.github/composite/validate-db
        with:
          SECRETS: ${{ toJSON(secrets) }}

  buildImage:
    name: Build Docker Image & Upload to Registry
    runs-on: ubuntu-latest
    needs: [validateDBSchema, backendTests, frontendTests]

    if: github.ref_name == 'main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run workflow
        uses: ./.github/composite/build-image
        with:
          environment: production
          SECRETS: ${{ toJSON(secrets) }}

  buildStandupBotImage:
    name: Build codebloom-standup-bot Docker Image & Upload to Registry
    runs-on: ubuntu-latest

    if: github.ref_name == 'main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run workflow
        uses: ./.github/composite/build-image/internal/standup-bot
        with:
          SECRETS: ${{ toJSON(secrets) }}

  deploy:
    name: deploy codebloom to K8S
    runs-on: ubuntu-latest
    needs: buildImage
    environment: production

    if: github.ref_name == 'main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run workflow
        uses: ./.github/composite/redeploy
        with:
          SECRETS: ${{ toJSON(secrets) }}

  deployStandupBot:
    name: deploy codebloom-standup-bot to K8S
    runs-on: ubuntu-latest
    needs: buildStandupBotImage
    environment: production

    if: github.ref_name == 'main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run workflow
        uses: ./.github/composite/redeploy/internal/standup-bot
        with:
          SECRETS: ${{ toJSON(secrets) }}
