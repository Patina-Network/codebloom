name: CI/CD
run-name: Running CI/CD on ${{ github.actor }}'s commits

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backendPreTest:
    name: Backend Pre Test
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run workflow
        uses: ./.github/composite/test/backend-pre-test

  e2ePreTest:
    name: E2E Pre Test
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup CI
        uses: tahminator/pipeline/actions/setup@aa4f2ffcca89a9dcad96c1eac1e57b5a533f8c26 # 1.0.100
        with:
          INSTALL_PNPM: "true"
          PNPM_VERSION: "10.24.0"
          PNPM_CACHE: "true"
          PNPM_CACHE_DEPENDENCY_PATH: js/pnpm-lock.yaml
          PNPM_PACKAGE_JSON_FILE: js/package.json

      - name: Run pre test
        shell: bash
        run: cd e2e && pnpm i && pnpm run test

  backendTests:
    name: Backend Tests
    runs-on: ubuntu-26.04
    needs: backendPreTest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run workflow
        uses: ./.github/composite/test/backend-test
        with:
          SECRETS: ${{ toJSON(secrets) }}

  frontendTests:
    name: Frontend Tests
    runs-on: ubuntu-26.04
    needs: backendPreTest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run workflow
        uses: ./.github/composite/test/frontend-test
        with:
          SECRETS: ${{ toJSON(secrets) }}

  buildStagingImage:
    name: Build staging image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: backendPreTest

    if: github.ref_name != 'main'

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run workflow
        uses: ./.github/composite/build-image
        with:
          ENVIRONMENT: staging
          DOCKER_UPLOAD: "true"
          ARCH: ${{ matrix.arch }}
          SECRETS: ${{ toJSON(secrets) }}

  buildStagingStandupBotImage:
    name: Build staging image for codebloom-standup-bot (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    if: github.ref_name != 'main'

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run workflow
        uses: ./.github/composite/build-image/internal/standup-bot
        with:
          SECRETS: ${{ toJSON(secrets) }}
          ENVIRONMENT: staging
          DOCKER_UPLOAD: "true"
          ARCH: ${{ matrix.arch }}

  buildStagingLeetcodeAuthServiceImage:
    name: Build staging image for codebloom-leetcode-auth-stealer-service (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    if: github.event_name == 'pull_request'

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run workflow
        uses: ./.github/composite/build-image/internal/leetcode-auth-stealer-service
        with:
          SECRETS: ${{ toJSON(secrets) }}
          ENVIRONMENT: staging
          DOCKER_UPLOAD: "true"
          ARCH: ${{ matrix.arch }}

  deployStagingLeetcodeAuthService:
    name: Deploy staging codebloom-leetcode-auth-stealer-service to K8s
    runs-on: ubuntu-26.04
    needs: buildStagingLeetcodeAuthServiceImage

    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run workflow
        uses: ./.github/composite/redeploy/internal/leetcode-auth-stealer-service
        with:
          SECRETS: ${{ toJSON(secrets) }}
          ENVIRONMENT: staging
          SHA: ${{ github.sha }}

  validateDBSchema:
    name: Validate DB Schema on Prod DB
    runs-on: ubuntu-26.04
    needs: backendPreTest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run workflow
        uses: ./.github/composite/validate-db
        with:
          SECRETS: ${{ toJSON(secrets) }}
          HEADSCALE_ADDRESS: ${{ secrets.HEADSCALE_ADDRESS }}
          HEADSCALE_USER: ${{ secrets.HEADSCALE_USER }}
          HEADSCALE_PREAUTHKEY: ${{ secrets.HEADSCALE_PREAUTHKEY }}

  buildImage:
    name: Build Docker Image & Upload to Registry (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [validateDBSchema, backendTests, frontendTests]

    if: github.ref_name == 'main'

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run workflow
        uses: ./.github/composite/build-image
        with:
          environment: production
          SECRETS: ${{ toJSON(secrets) }}
          ARCH: ${{ matrix.arch }}

  buildStandupBotImage:
    name: Build codebloom-standup-bot Docker Image & Upload to Registry (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    if: github.ref_name == 'main'

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run workflow
        uses: ./.github/composite/build-image/internal/standup-bot
        with:
          SECRETS: ${{ toJSON(secrets) }}
          ARCH: ${{ matrix.arch }}

  buildLeetcodeAuthServiceImage:
    name: Build codebloom-leetcode-auth-stealer-service Docker Image & Upload to Registry (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run workflow
        uses: ./.github/composite/build-image/internal/leetcode-auth-stealer-service
        with:
          SECRETS: ${{ toJSON(secrets) }}
          ENVIRONMENT: production
          DOCKER_UPLOAD: "true"
          ARCH: ${{ matrix.arch }}

  deployLeetcodeAuthService:
    name: Deploy codebloom-leetcode-auth-stealer-service to K8s
    runs-on: ubuntu-26.04
    needs: buildLeetcodeAuthServiceImage

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run workflow
        uses: ./.github/composite/redeploy/internal/leetcode-auth-stealer-service
        with:
          SECRETS: ${{ toJSON(secrets) }}
          ENVIRONMENT: production
          SHA: ${{ github.sha }}

  deploy:
    name: deploy codebloom to K8S
    runs-on: ubuntu-26.04
    needs: buildImage
    environment: production

    if: github.ref_name == 'main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run workflow
        uses: ./.github/composite/redeploy
        with:
          SECRETS: ${{ toJSON(secrets) }}
          HEADSCALE_ADDRESS: ${{ secrets.HEADSCALE_ADDRESS }}
          HEADSCALE_USER: ${{ secrets.HEADSCALE_USER }}
          HEADSCALE_PREAUTHKEY: ${{ secrets.HEADSCALE_PREAUTHKEY }}

  deployStandupBot:
    name: deploy codebloom-standup-bot to K8S
    runs-on: ubuntu-26.04
    needs: buildStandupBotImage
    environment: production

    if: github.ref_name == 'main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run workflow
        uses: ./.github/composite/redeploy/internal/standup-bot
        with:
          SECRETS: ${{ toJSON(secrets) }}
