# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: E2E tests
run-name: Running E2E tests

concurrency:
  group: e2e-shared-staging-services
  cancel-in-progress: false

permissions:
  contents: read

on:
  schedule:
    - cron: "18 17 * * *" # 12:18 PM EST / 1:18 PM EDT daily
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Validated PR head SHA; empty uses the caller's ref"
        type: string
        required: false
      skip_discord:
        type: boolean
        required: false
        default: false

jobs:
  runE2E:
    name: "Run E2E"
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup CI
        uses: tahminator/pipeline/actions/setup@f5961a7e43a99ee5646ab7138f8b5cd2bfdeb24b # 1.0.101
        with:
          LINT_CI: true
          SECRETS: ${{ toJSON(secrets) }}
          HEADSCALE_ADDRESS: ${{ secrets.HEADSCALE_ADDRESS }}
          HEADSCALE_USER: ${{ secrets.HEADSCALE_USER }}
          HEADSCALE_PREAUTHKEY: ${{ secrets.HEADSCALE_PREAUTHKEY }}
          INSTALL_PNPM: "true"
          PNPM_VERSION: "10.24.0"
          PNPM_CACHE: "true"
          PNPM_CACHE_DEPENDENCY_PATH: js/pnpm-lock.yaml
          PNPM_PACKAGE_JSON_FILE: js/package.json
          INSTALL_JAVA: "true"
          JAVA_VERSION: "25"
          JAVA_CACHE_PATH: |
            ~/.m2
            ~/repository
          JAVA_CACHE_KEY: ${{ github.job }}-${{ hashFiles('**/pom.xml') }}

      - name: Run script
        shell: bash
        env:
          E2E_EMAIL_IMAP_HOST: ${{ secrets.E2E_EMAIL_IMAP_HOST }}
          E2E_EMAIL_IMAP_PORT: ${{ secrets.E2E_EMAIL_IMAP_PORT }}
          E2E_EMAIL_USERNAME: ${{ secrets.E2E_EMAIL_USERNAME }}
          E2E_EMAIL_PASSWORD: ${{ secrets.E2E_EMAIL_PASSWORD }}
          SKIP_DISCORD: ${{ inputs.skip_discord || false }}
          PR_HEAD_SHA: ${{ inputs.ref || '' }}
          ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun run .github/scripts/test/run-e2e-tests.ts --skip-discord-message="$SKIP_DISCORD" --action-url="$ACTION_URL" --sha="$PR_HEAD_SHA"
