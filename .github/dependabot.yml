version: 2

multi-ecosystem-groups:
  main:
    schedule: { interval: weekly }
    commit-message: { prefix: "deps(main)" }
  cicd:
    schedule: { interval: weekly }
    commit-message: { prefix: "deps(ci)" }
  non-main:
    schedule: { interval: monthly }
    commit-message: { prefix: "deps(non-main)" }

updates:
  # main
  - package-ecosystem: maven
    directory: /
    patterns: ["*"]
    cooldown: { default-days: 7 }
    multi-ecosystem-group: main
  - package-ecosystem: npm
    directories:
      - /e2e
      - /email
      - /js
    patterns: ["*"]
    cooldown: { default-days: 7 }
    # openapi-typescript is pinned and patched via pnpm patchedDependencies
    # (js/patches/openapi-typescript@7.8.0.patch); bump it by hand and regenerate the patch.
    ignore:
      - dependency-name: openapi-typescript
    multi-ecosystem-group: main
  - package-ecosystem: uv
    directory: /internal/leetcode-auth-stealer-service
    patterns: ["*"]
    cooldown: { default-days: 7 }
    multi-ecosystem-group: main
  - package-ecosystem: docker
    directories:
      - /infra
      - /internal/leetcode-auth-stealer-service
    patterns: ["*"]
    cooldown: { default-days: 7 }
    multi-ecosystem-group: main
  # cicd
  - package-ecosystem: github-actions
    directories:
      - /
      - "/.github/composite/**"
    patterns: ["*"]
    cooldown: { default-days: 7 }
    multi-ecosystem-group: cicd
  # cannot enable until https://github.com/dependabot/dependabot-core/issues/15237 is fixed
  # - package-ecosystem: bun
  #   directory: /.github/scripts
  #   patterns: ["*"]
  #   cooldown: { default-days: 7 }
  #   multi-ecosystem-group: cicd
  # non-main
  - package-ecosystem: cargo
    directory: /internal/standup-bot
    patterns: ["*"]
    cooldown: { default-days: 7 }
    multi-ecosystem-group: non-main
  - package-ecosystem: docker
    directory: /internal/standup-bot
    patterns: ["*"]
    cooldown: { default-days: 7 }
    multi-ecosystem-group: non-main
