name: "Re-Deploy codebloom-standup-bot to Coolify"
description: "Trigger a deployment of the standup bot to Coolify."

inputs:
  SECRETS:
    description: "Pass toJSON(secrets) from the calling workflow to expose all secrets as env vars."
    required: false
  ENVIRONMENT:
    description: '"staging" or "production"'
    required: false
    default: production
  SHA:
    description: "(Staging only). Current commit SHA"
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup CI
      uses: tahminator/pipeline/actions/setup@a424f92d486342e1255fcdf377a7569eb230aabe # 1.0.97
      with:
        LINT_CI: true
        SECRETS: ${{ inputs.SECRETS }}

    - name: Run script
      shell: bash
      run: |
        bun run .github/scripts/redeploy \
            --environment="${{ inputs.ENVIRONMENT }}" \
            --sha="${{ inputs.SHA }}" \
            --type="standup-bot"
