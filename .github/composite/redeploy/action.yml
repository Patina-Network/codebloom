name: "Re-Deploy to DigitalOcean"
description: "Trigger a deployment to DigitalOcean and migrate the associated database."

inputs:
  SECRETS:
    description: "Pass toJSON(secrets) from the calling workflow to expose all secrets as env vars."
    required: false
  ENVIRONMENT:
    description: '"staging" or "production"'
    required: false
    default: production
  SHA:
    description: "(Staging only). Current commit SHA"
    required: false
  HEADSCALE_ADDRESS:
    description: "Headscale address (passing any of the Headscale args in will enable Headscale support for the job)"
    required: false
  HEADSCALE_USER:
    description: "Headscale user (passing any of the Headscale args in will enable Headscale support for the job)"
    required: false
  HEADSCALE_PREAUTHKEY:
    description: "Headscale preauthkey (passing any of the Headscale args in will enable Headscale support for the job)"
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup CI
      uses: tahminator/pipeline/actions/setup@a424f92d486342e1255fcdf377a7569eb230aabe # 1.0.97
      with:
        LINT_CI: true
        SECRETS: ${{ inputs.SECRETS }}
        HEADSCALE_ADDRESS: ${{ inputs.HEADSCALE_ADDRESS }}
        HEADSCALE_USER: ${{ inputs.HEADSCALE_USER }}
        HEADSCALE_PREAUTHKEY: ${{ inputs.HEADSCALE_PREAUTHKEY }}
        INSTALL_JAVA: true
        JAVA_VERSION: "25"
        JAVA_CACHE_KEY: ${{ github.job }}-${{ hashFiles('**/pom.xml') }}
        JAVA_CACHE_PATH: |
          ~/.m2
          ~/repository
        INSTALL_PNPM: true
        PNPM_VERSION: "10.24.0"
        PNPM_CACHE: true
        PNPM_CACHE_DEPENDENCY_PATH: js/pnpm-lock.yaml
        PNPM_PACKAGE_JSON_FILE: js/package.json

    - name: Run script
      shell: bash
      run: |
        bun run .github/scripts/redeploy \
            --environment="${{ inputs.ENVIRONMENT }}" \
            --sha="${{ inputs.SHA }}"
