name: "Validate DB"
description: "Validate the current db/ folder at a current commit against a database"

inputs:
  SECRETS:
    description: "Pass toJSON(secrets) from the calling workflow to expose all secrets as env vars."
    required: false
  ENVIRONMENT:
    description: '"staging" or "production"'
    required: false
    default: production
  SHA:
    description: "(Staging only). Current commit SHA"
    required: false
  HEADSCALE_ADDRESS:
    description: "Headscale address (passing any of the Headscale args in will enable Headscale support for the job)"
    required: false
  HEADSCALE_USER:
    description: "Headscale user (passing any of the Headscale args in will enable Headscale support for the job)"
    required: false
  HEADSCALE_PREAUTHKEY:
    description: "Headscale preauthkey (passing any of the Headscale args in will enable Headscale support for the job)"
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup CI
      uses: tahminator/pipeline/actions/setup@ff36293f28519b2b90d7e28918a6885d9baf019e # 1.0.90
      with:
        LINT_CI: true
        SECRETS: ${{ inputs.SECRETS }}
        HEADSCALE_ADDRESS: ${{ inputs.HEADSCALE_ADDRESS }}
        HEADSCALE_USER: ${{ inputs.HEADSCALE_USER }}
        HEADSCALE_PREAUTHKEY: ${{ inputs.HEADSCALE_PREAUTHKEY }}

    - name: Set up OpenJDK 25
      uses: actions/setup-java@v5
      with:
        distribution: "temurin"
        java-version: "25"

    - name: Cache Maven packages
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2
          ~/repository
        key: ${{ github.job }}-${{ hashFiles('**/pom.xml') }}

    - name: Run script
      shell: bash
      run: bun run .github/scripts/validate-db --environment=${{ inputs.ENVIRONMENT }} --sha=${{ inputs.SHA }}
