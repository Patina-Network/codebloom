name: "Backend test"
description: "Run backend tests"

inputs:
  SECRETS:
    description: "Pass toJSON(secrets) from the calling workflow to expose all secrets as env vars."
    required: false
  UPLOAD_TEST_COV:
    description: "Boolean indicating whether tests should be uploaded to our code coverage provider or not."
    required: false
    default: true

runs:
  using: "composite"
  steps:
    - name: Setup CI
      uses: tahminator/pipeline/actions/setup@a424f92d486342e1255fcdf377a7569eb230aabe # 1.0.97
      with:
        LINT_CI: true
        SECRETS: ${{ inputs.SECRETS }}
        INSTALL_JAVA: true
        JAVA_VERSION: "25"
        JAVA_CACHE_KEY: ${{ github.job }}-${{ hashFiles('**/pom.xml') }}
        JAVA_CACHE_PATH: |
          ~/.m2
          ~/repository
        INSTALL_PNPM: true
        PNPM_VERSION: "10.24.0"
        PNPM_CACHE: true
        PNPM_CACHE_DEPENDENCY_PATH: js/pnpm-lock.yaml
        PNPM_PACKAGE_JSON_FILE: js/package.json

    - name: Install JS dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      working-directory: js

    - name: Run script
      shell: bash
      run: bun run .github/scripts/test/run-backend-tests --should-upload-coverage=${{ inputs.UPLOAD_TEST_COV }}

    - name: Publish Junit Report
      uses: mikepenz/action-junit-report@v6
      if: ${{ always() }}
      with:
        report_paths: "target/surefire-reports/TEST-*.xml"
        detailed_summary: true
        include_time_in_summary: true
        fail_on_failure: false
