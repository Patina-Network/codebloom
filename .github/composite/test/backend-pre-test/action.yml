name: "Backend Pre Test"
description: "Run backend linter & formatter checks + attempt to compile (NO TESTS)"
runs:
  using: "composite"
  steps:
    - name: Setup CI
      uses: tahminator/pipeline/actions/setup@a424f92d486342e1255fcdf377a7569eb230aabe # 1.0.97
      with:
        LINT_CI: true
        INSTALL_JAVA: true
        JAVA_VERSION: "25"
        JAVA_CACHE_KEY: ${{ github.job }}-${{ hashFiles('**/pom.xml') }}
        JAVA_CACHE_PATH: |
          ~/.m2
          ~/repository

    - name: Run script
      shell: bash
      run: bun .github/scripts/test/run-backend-compile-tests
