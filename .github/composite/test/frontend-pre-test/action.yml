name: "Frontend Pre Test"
description: "Run frontend linter & formatter checks + attempt to compile (NO TESTS)"

inputs:
  SECRETS:
    description: "Pass toJSON(secrets) from the calling workflow to expose all secrets as env vars."
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup CI
      uses: tahminator/pipeline/actions/setup@a424f92d486342e1255fcdf377a7569eb230aabe # 1.0.97
      with:
        LINT_CI: true
        SECRETS: ${{ inputs.SECRETS }}
        INSTALL_JAVA: true
        JAVA_VERSION: "25"
        JAVA_CACHE_KEY: ${{ github.job }}-${{ hashFiles('**/pom.xml') }}
        JAVA_CACHE_PATH: |
          ~/.m2
          ~/repository
        INSTALL_PNPM: true
        PNPM_VERSION: "10.24.0"
        PNPM_CACHE: true
        PNPM_CACHE_DEPENDENCY_PATH: js/pnpm-lock.yaml
        PNPM_PACKAGE_JSON_FILE: js/package.json

    - name: Install JS dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      working-directory: js

    - name: Run script
      shell: bash
      run: bun .github/scripts/test/run-frontend-pre-tests
