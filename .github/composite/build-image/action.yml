name: "Build & Upload Docker Image"
description: "Build & (optionally) upload Docker Image to Docker Registry"

inputs:
  DOCKER_UPLOAD:
    description: "Boolean indicating whether the image should be uploaded to Docker registry or not."
    required: false
    default: "true"
  ENVIRONMENT:
    description: "'staging' or 'production'"
    required: true
  SECRETS:
    description: "Pass toJSON(secrets) from the calling workflow to expose all secrets as env vars."
    required: false
  ARCH:
    description: "Target architecture to build natively (amd64 or arm64). arm64 pushes to codebloom-arm instead of codebloom."
    required: false
    default: amd64

outputs:
  tag:
    description: "Built Docker image tag (git SHA, with optional prefix)"
    value: ${{ steps.build-image.outputs.tag }}

runs:
  using: "composite"
  steps:
    - name: Setup CI
      uses: tahminator/pipeline/actions/setup@a424f92d486342e1255fcdf377a7569eb230aabe # 1.0.97
      with:
        LINT_CI: true
        SECRETS: ${{ inputs.SECRETS }}
        INSTALL_JAVA: true
        JAVA_VERSION: "25"
        JAVA_CACHE_KEY: ${{ github.job }}-${{ hashFiles('**/pom.xml') }}
        JAVA_CACHE_PATH: |
          ~/.m2
          ~/repository
        INSTALL_PNPM: true
        PNPM_VERSION: "10.24.0"
        PNPM_CACHE: true
        PNPM_CACHE_DEPENDENCY_PATH: js/pnpm-lock.yaml
        PNPM_PACKAGE_JSON_FILE: js/package.json

    - name: Install JS dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      working-directory: js

    - name: Run script
      id: build-image
      shell: bash
      run: |
        bun run .github/scripts/build-image \
            --environment "${{ inputs.ENVIRONMENT }}" \
            --docker-upload="${{ inputs.DOCKER_UPLOAD }}" \
            --getGhaOutput=true \
            --arch="${{ inputs.ARCH }}" \
            --prId="${{ github.event.pull_request.number }}"
