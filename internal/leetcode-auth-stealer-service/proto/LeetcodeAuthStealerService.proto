syntax = "proto3";

package codebloom.leetcode.auth.v1;

option java_package = "org.patinanetwork.codebloom.grpc.leetcode.auth.v1";
option java_multiple_files = true;

service LeetcodeAuthStealerService {
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
}

message AuthenticateRequest {
  string login = 1;
  string password = 2;
}

message AuthenticateResponse {
  string leetcode_session = 1;
  string csrf_token = 2;
}
